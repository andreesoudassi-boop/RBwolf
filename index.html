<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBwolf Bilverkstad – Bromölla</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root{--gold:#FFD600;--gold2:#FFA500;--black:#0a0a0a;--dark:#111;--card:#161616}
        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{font-family:'Barlow',Arial,sans-serif;background:#0a0a0a;color:#fff;overflow-x:hidden}
        
        /* Enkel styling för formuläret */
        .container { max-width: 600px; margin: 50px auto; padding: 20px; background: var(--card); border-radius: 8px; border: 1px solid var(--gold); }
        h1 { font-family: 'Bebas Neue', sans-serif; color: var(--gold); margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; }
        input, textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 15px; background: var(--gold); border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1.1rem; }
        button:hover { background: var(--gold2); }
    </style>
</head>
<body>

<div class="container">
    <h1>Boka Tid</h1>
    <form id="booking-form">
        <div class="form-group">
            <label>Namn</label>
            <input type="text" name="name" required placeholder="Ditt namn">
        </div>
        <div class="form-group">
            <label>E-post</label>
            <input type="email" name="email" required placeholder="din@epost.se">
        </div>
        <div class="form-group">
            <label>Reg-nr</label>
            <input type="text" name="reg" required placeholder="ABC 123">
        </div>
        <div class="form-group">
            <label>Bilmodell</label>
            <input type="text" name="car" required placeholder="T.ex. Volvo V60">
        </div>
        <div class="form-group">
            <label>Datum</label>
            <input type="date" name="date" required>
        </div>
        <div class="form-group">
            <label>Tid</label>
            <input type="time" name="time" required>
        </div>
        <div class="form-group">
            <label>Beskrivning</label>
            <textarea name="desc" rows="4" placeholder="Vad behöver göras?"></textarea>
        </div>
        <button type="submit">SKICKA BOKNING</button>
    </form>
</div>

<script type="text/javascript">
(function() {
    // VIKTIGT: Ersätt "DIN_PUBLIC_KEY" med din faktiska Public Key från EmailJS
    emailjs.init("YOUR_PUBLIC_KEY_HERE");

    const form = document.getElementById('booking-form');

    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        // Samla in data från formuläret
        const params = {
            customer_name: document.querySelector('[name="name"]').value,
            customer_email: document.querySelector('[name="email"]').value,
            to_email: document.querySelector('[name="email"]').value, // Skickar kopia till kund?
            reg: document.querySelector('[name="reg"]').value,
            car: document.querySelector('[name="car"]').value,
            date: document.querySelector('[name="date"]').value,
            time: document.querySelector('[name="time"]').value,
            desc: document.querySelector('[name="desc"]').value
        };

        console.log("Skickar params:", params);

        try {
            // Använd dina ID:n från EmailJS dashboard
            await emailjs.send("service_8wmiuen", "template_fbcfzng", params);
            
            alert("Bokning skickad! Vi hör av oss inom kort.");
            form.reset();
        } catch (error) {
            console.error("FEL VID SKICKNING:", error);
            alert("Något gick fel: " + JSON.stringify(error));
        }
    });
})();
</script>

</body>
</html>
